version: "3"

services:

  postgres:
    container_name: restos_postgres
    restart: unless-stopped
    image: postgres:18.1
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-restos}
    volumes:
      - restos_postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d ${POSTGRES_DB:-restos} -U ${POSTGRES_USER:-postgres}" ]
      interval: 5s
      timeout: 10s
      retries: 5
    # Removed exposed ports - only internal network access
    networks:
      - restos_internal

  redis:
    container_name: restos_redis
    restart: unless-stopped
    image: redis:8.4.0
    command: redis-server --appendonly yes
    volumes:
      - restos_redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    # Removed exposed ports - only internal network access
    networks:
      - restos_internal

  api:
    container_name: restos_api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_signal: SIGTERM
    build:
      context: .
      dockerfile: ./docker/api/api.Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Database
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-restos}
      - DATABASE_POOL_SIZE=${DATABASE_POOL_SIZE:-10}
      - DATABASE_MAX_OVERFLOW=${DATABASE_MAX_OVERFLOW:-20}
      - DATABASE_POOL_RECYCLE=${DATABASE_POOL_RECYCLE:-3600}
      # Redis (used by AI service / sessions)
      - REDIS_DSN=redis://redis:6379/0
      # JWT auth
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_EXPIRE_DAYS=${JWT_EXPIRE_DAYS:-30}
      # Webapp ChaCha20 token
      - WEBAPP_SECRET_KEY=${WEBAPP_SECRET_KEY}
      - WEBAPP_TOKEN_EXPIRY=${WEBAPP_TOKEN_EXPIRY:-3600}
      - WEBAPP_BASE_URL=${WEBAPP_BASE_URL:-http://localhost:8080}
      - WEBAPP_API_URL=${WEBAPP_API_URL:-}
      # Internal key protecting /webapp/token and /webapp/page-token
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-}
      # CORS — set to your frontend origin in production
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - CORS_ALLOW_CREDENTIALS=${CORS_ALLOW_CREDENTIALS:-true}
      # SMS delivery (credentials stay in the deployment environment)
      - SMS_PROVIDER=${SMS_PROVIDER:-disabled}
      - SMS_AERO_EMAIL=${SMS_AERO_EMAIL:-}
      - SMS_AERO_API_KEY=${SMS_AERO_API_KEY:-}
      - SMS_AERO_SIGN=${SMS_AERO_SIGN:-}
      - SMS_AERO_BASE_URL=${SMS_AERO_BASE_URL:-}
      - SMS_HTTP_TIMEOUT_SECONDS=${SMS_HTTP_TIMEOUT_SECONDS:-10}
      - ACCOUNT_AUTH_SMS_AUTOFILL_DOMAIN=${ACCOUNT_AUTH_SMS_AUTOFILL_DOMAIN:-}
      # Default admin (created on first startup)
      - DEFAULT_ADMIN_LOGIN=${DEFAULT_ADMIN_LOGIN:-admin}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:-admin123}
      - DEFAULT_ADMIN_NAME=${DEFAULT_ADMIN_NAME:-Главный администратор}
      - DEFAULT_ORG_NAME=${DEFAULT_ORG_NAME:-Моя организация}
      - DEFAULT_ORG_CODE=${DEFAULT_ORG_CODE:-main}
      # Bot token required by settings loader even in API-only mode
      - TGBOT_TOKEN=${TGBOT_TOKEN:-dummy}
      - TGBOT_ADMIN_IDS=${TGBOT_ADMIN_IDS:-0}
      # Google Sheets / Drive
      - GOOGLE_SERVICE_ACCOUNT_JSON=${GOOGLE_SERVICE_ACCOUNT_JSON:-}
      - GOOGLE_SERVICE_ACCOUNT_JSON_DATA=${GOOGLE_SERVICE_ACCOUNT_JSON_DATA:-}
      - GOOGLE_SHEETS_FETCH_TIMEOUT=${GOOGLE_SHEETS_FETCH_TIMEOUT:-15}
      - GOOGLE_SHEETS_MAX_ROWS=${GOOGLE_SHEETS_MAX_ROWS:-500}
      # Environment
      - APP_ENV=${APP_ENV:-production}
    networks:
      - restos_internal
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"

  bot:
    container_name: restos_bot
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_signal: SIGINT
    build:
      context: .
      dockerfile: ./docker/bot/bot.Dockerfile
    command: [ "poetry", "run", "python", "local_bot.py" ]
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-restos}
      - DATABASE_POOL_SIZE=${DATABASE_POOL_SIZE:-10}
      - DATABASE_MAX_OVERFLOW=${DATABASE_MAX_OVERFLOW:-20}
      - DATABASE_POOL_RECYCLE=${DATABASE_POOL_RECYCLE:-3600}
      - REDIS_DSN=redis://redis:6379/0
      - TGBOT_TOKEN=${TGBOT_TOKEN}
      - TGBOT_ADMIN_IDS=${TGBOT_ADMIN_IDS}
      - TGBOT_USE_REDIS=true
      - TGBOT_TRIGGER_MESSAGE_BUSINESS_CHAT=${TGBOT_TRIGGER_MESSAGE_BUSINESS_CHAT:-start}
      - TGBOT_TRIGGER_AUTO_MESSAGE_BUSINESS_CHAT=${TGBOT_TRIGGER_AUTO_MESSAGE_BUSINESS_CHAT:-help}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_EXPIRE_DAYS=${JWT_EXPIRE_DAYS:-30}
      - WEBAPP_SECRET_KEY=${WEBAPP_SECRET_KEY}
      - WEBAPP_TOKEN_EXPIRY=${WEBAPP_TOKEN_EXPIRY:-3600}
      - WEBAPP_BASE_URL=${WEBAPP_BASE_URL:-http://localhost:8080}
      - WEBAPP_API_URL=${WEBAPP_API_URL:-}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - CORS_ALLOW_CREDENTIALS=${CORS_ALLOW_CREDENTIALS:-true}
      - DEFAULT_ADMIN_LOGIN=${DEFAULT_ADMIN_LOGIN:-admin}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:-admin123}
      - DEFAULT_ADMIN_NAME=${DEFAULT_ADMIN_NAME:-Главный администратор}
      - DEFAULT_ORG_NAME=${DEFAULT_ORG_NAME:-Моя организация}
      - DEFAULT_ORG_CODE=${DEFAULT_ORG_CODE:-main}
      - GOOGLE_SERVICE_ACCOUNT_JSON=${GOOGLE_SERVICE_ACCOUNT_JSON:-}
      - GOOGLE_SERVICE_ACCOUNT_JSON_DATA=${GOOGLE_SERVICE_ACCOUNT_JSON_DATA:-}
      - GOOGLE_SHEETS_FETCH_TIMEOUT=${GOOGLE_SHEETS_FETCH_TIMEOUT:-15}
      - GOOGLE_SHEETS_MAX_ROWS=${GOOGLE_SHEETS_MAX_ROWS:-500}
      - APP_ENV=${APP_ENV:-production}
    networks:
      - restos_internal
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"

  dioxus-form:
    container_name: restos_dioxus_form
    build:
      context: .
      dockerfile: ./docker/dioxus/Dockerfile
    restart: unless-stopped
    # Only expose internally or through reverse proxy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - RUST_LOG=info
    networks:
      - restos_internal
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"


volumes:
  restos_postgres_data:
  restos_redis_data:

# Internal network for secure service communication
networks:
  restos_internal:
    driver: bridge
    internal: false  # Set to true for completely isolated network (no external access)

