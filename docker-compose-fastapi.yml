version: '3.8'

services:
  fastapi:
    build:
      context: .
      dockerfile: docker/fastapi/Dockerfile
    container_name: yarbot-fastapi
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - PYTHONUNBUFFERED=1
    depends_on:
      - postgres
      - redis
    volumes:
      - ./app:/app/app
      - ./migrations:/app/migrations
      - ./alembic.ini:/app/alembic.ini
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - yarbot-network
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: yarbot-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-yarbot}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-yarbot}
      - POSTGRES_DB=${POSTGRES_DB:-yarbot}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - yarbot-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: yarbot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - yarbot-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: yarbot-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - fastapi
    networks:
      - yarbot-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  yarbot-network:
    driver: bridge
